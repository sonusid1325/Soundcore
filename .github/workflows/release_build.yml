name: Release Build — All Variants

# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Manual: Go to Actions → "Release Build — All Variants" → Run workflow
#   • Auto:   On every push of a version tag  (e.g. git tag v1.0.0 && git push --tags)
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: 'Create a GitHub Release after build?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets → Actions):
#
#   KEYSTORE_BASE64      → base64-encoded .jks / .keystore file
#   KEYSTORE_PASSWORD    → storePassword for the keystore
#   KEY_ALIAS            → key alias inside the keystore
#   KEY_PASSWORD         → key password (often same as KEYSTORE_PASSWORD)
#
# Optional secrets (only needed if you use these features):
#   LASTFM_API_KEY       → Last.fm API key
#   LASTFM_SECRET        → Last.fm secret
#   TOGETHER_BEARER_TOKEN
#   CANVAS_BEARER_TOKEN
#
# See KEYSTORE_SETUP.md at the repo root for step-by-step instructions.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build every variant in parallel
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.device }}-${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # keep building other variants even if one fails
      matrix:
        include:
          # ── Mobile variants ──────────────────────────────────────────────
          - device: mobile
            deviceName: Mobile
            abi: universal      # all architectures in one APK
          - device: mobile
            deviceName: Mobile
            abi: arm64          # most modern Android phones
          - device: mobile
            deviceName: Mobile
            abi: armeabi        # older ARM devices
          - device: mobile
            deviceName: Mobile
            abi: x86            # emulators / Intel tablets
          - device: mobile
            deviceName: Mobile
            abi: x86_64         # x86_64 emulators
          # ── TV variant ───────────────────────────────────────────────────
          - device: tv
            deviceName: Tv
            abi: universal

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ───────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 3. Gradle cache ───────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-cleanup: on-success

      # ── 4. Decode keystore from secret ────────────────────────────────────
      - name: Decode keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/release.keystore
          echo "✅ Keystore decoded to app/keystore/release.keystore"

      # ── 5. Resolve Gradle task & artifact names ───────────────────────────
      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DEVICE_CAP="${{ matrix.deviceName }}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"

          echo "gradle_task=assemble${DEVICE_CAP}${ABI_CAP}Release" >> "$GITHUB_OUTPUT"
          echo "artifact_name=SoundCore-${DEVICE}-${ABI}-release"   >> "$GITHUB_OUTPUT"
          echo "apk_name=SoundCore-${DEVICE}-${ABI}-release.apk"    >> "$GITHUB_OUTPUT"
          echo "device_cap=$DEVICE_CAP"                              >> "$GITHUB_OUTPUT"
          echo "abi_cap=$ABI_CAP"                                    >> "$GITHUB_OUTPUT"

      # ── 6. Build ──────────────────────────────────────────────────────────
      - name: Build release APK — ${{ matrix.device }}-${{ matrix.abi }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.variant.outputs.gradle_task }}
        env:
          STORE_PASSWORD:          ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:               ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:            ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY:          ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET:           ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN:   ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN:     ${{ secrets.CANVAS_BEARER_TOKEN }}

      # ── 7. Find the built APK ─────────────────────────────────────────────
      - name: Locate APK output directory
        id: apk_dir
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"

          for d in \
            "app/build/outputs/apk/${DEVICE}/${ABI}/release" \
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release" \
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
          do
            if [ -d "$d" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              echo "✅ Found APK dir: $d"
              exit 0
            fi
          done

          echo "❌ Could not find APK output dir. Available paths:"
          find app/build/outputs/apk -maxdepth 8 -type d || true
          exit 1

      # ── 8. Sign the APK ───────────────────────────────────────────────────
      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir:       ${{ steps.apk_dir.outputs.dir }}/
          signingKey:       ${{ secrets.KEYSTORE_BASE64 }}
          keyAlias:         ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword:      ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      # ── 9. Rename signed APK to a clean name ─────────────────────────────
      - name: Rename signed APK
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.apk_dir.outputs.dir }}"
          mkdir -p "$DIR/out"
          SIGNED=$(find "$DIR" -maxdepth 1 \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | head -n 1)
          if [ -z "$SIGNED" ]; then
            echo "❌ No signed APK found in $DIR"
            ls -la "$DIR" || true
            exit 1
          fi
          mv "$SIGNED" "$DIR/out/${{ steps.variant.outputs.apk_name }}"
          echo "✅ Signed APK: $DIR/out/${{ steps.variant.outputs.apk_name }}"

      # ── 10. Upload as workflow artifact ───────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.variant.outputs.artifact_name }}
          path: ${{ steps.apk_dir.outputs.dir }}/out/${{ steps.variant.outputs.apk_name }}
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Create GitHub Release (runs after all builds succeed)
  #         Triggered automatically on tag push, or when input = 'true'
  # ───────────────────────────────────────────────────────────────────────────
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.create_github_release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download every signed APK from the build job
      - name: Download all signed APKs
        uses: actions/download-artifact@v4
        with:
          pattern: SoundCore-*-release
          merge-multiple: false
          path: release_apks/

      - name: List downloaded APKs
        run: find release_apks -name "*.apk" | sort

      # Get version name from build.gradle.kts
      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # Build changelog from commit messages since last tag
      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "## What's New\n\n#{{CHANGELOG}}\n\n<details>\n<summary>Other commits</summary>\n\n#{{UNCATEGORIZED}}\n</details>",
              "pr_template": "- #{{TITLE}}",
              "categories": [
                { "title": "### ✨ Features",    "labels": ["feat", "feature"] },
                { "title": "### 🐛 Bug Fixes",   "labels": ["fix", "bug"] },
                { "title": "### ⚡ Performance", "labels": ["perf"] },
                { "title": "### 🔧 Refactors",   "labels": ["refactor"] },
                { "title": "### 📦 Build / CI",  "labels": ["build", "ci"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(feat|fix|perf|refactor|build|ci|chore)(\\([\\w\\-\\.]+\\))?(!)?:\\s+.*$",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create the release and attach all APKs
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: SoundCore v${{ steps.version.outputs.name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: release_apks/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
